<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change password — Polio Campaign Dashboard</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="login-wrap"><div class="login-card">
    <h1>Change password</h1>
    <form id="pwForm">
      <label>New password (at least 10 characters)</label>
      <input type="password" id="p1" required minlength="10" autocomplete="new-password">
      <label style="margin-top:0.75rem;">Repeat new password</label>
      <input type="password" id="p2" required minlength="10" autocomplete="new-password">
      <button class="btn" type="submit">Save new password</button>
      <div class="error-text" id="msg"></div>
    </form>
    <p class="muted" style="margin-top:1rem;"><a href="dashboard.html">Back to dashboard</a></p>
  </div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabaseClient.js"></script>
  <script>
    (async () => { await requireAuth(); })();
    document.getElementById("pwForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      const p1 = document.getElementById("p1").value, p2 = document.getElementById("p2").value;
      if (p1 !== p2) { msg.style.color = ""; msg.textContent = "The two passwords do not match."; return; }
      const { error } = await supabaseClient.auth.updateUser({ password: p1 });
      msg.style.color = error ? "" : "#1a7f5a";
      msg.textContent = error ? error.message : "Password changed. Use it next time you sign in.";
      if (!error) document.getElementById("pwForm").reset();
    });
  </script>
</body>
</html>
