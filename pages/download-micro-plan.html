<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download Micro Plan — Polio Campaign Dashboard</title>
<link rel="stylesheet" href="../assets/css/style.css?v=20261014h"><link rel="stylesheet" href="../assets/css/forms.css?v=20261014h">
<style>
  .dl-panel { background:#fff; border:1px solid #cfd6dd; border-radius:10px; padding:16px; max-width:860px; }
  .dl-panel label { display:block; font-weight:700; margin:12px 0 4px; font-size:.85rem; }
  .dl-panel select { width:100%; }
  .opt { display:flex; gap:10px; align-items:flex-start; border:2px solid #cfd6dd; border-radius:10px; padding:12px; margin:8px 0; cursor:pointer; }
  .opt.on { border-color:var(--brand); background:var(--brand-light); } .opt input { margin-top:4px; width:auto; } .opt b { display:block; } .opt span { font-size:.82rem; color:var(--t3); }
  .prog { height:10px; background:#e5eaee; border-radius:6px; overflow:hidden; margin-top:12px; display:none; } .prog > div { height:100%; width:0; background:var(--brand); transition:width .2s; }
  #msg { margin-top:10px; font-size:.9rem; } #msg.err { color:var(--bad); } #msg.ok { color:var(--ok); }
  .aic-list { margin-top:12px; } .aic-row { display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; border:1px solid #cfd6dd; border-radius:10px; padding:10px 12px; margin:8px 0; }
  .aic-row b { display:block; } .aic-row small { color:var(--t3); }
  .st { font-size:.78rem; font-weight:700; padding:3px 9px; border-radius:12px; white-space:nowrap; } .st.ok { background:#dff3e4; color:#17692e; } .st.no { background:#fde7e7; color:#a12a2a; }
  .aic-row .btn[disabled] { opacity:.45; cursor:not-allowed; }
  .pv { position:fixed; inset:0; background:rgba(20,28,36,.6); z-index:9999; display:none; } .pv.on { display:block; }
  .pv-in { position:absolute; inset:2vh 2vw; background:#eef1f4; border-radius:10px; display:flex; flex-direction:column; overflow:hidden; }
  .pv-top { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 14px; background:#fff; border-bottom:1px solid #cfd6dd; }
  .pv-body { overflow:auto; padding:14px; flex:1; } .pv-pg { background:#fff; border:1px solid #cfd6dd; border-radius:6px; padding:8px; margin:0 auto 14px; max-width:1300px; overflow:auto; }
  .pv-pg img { display:block; max-width:100%; margin:6px auto 0; } .pv-cap { font-weight:700; font-size:.9rem; } .pv-miss { text-align:center; padding:60px 10px; color:#a12a2a; font-weight:700; }
  .dlbtn { margin-top:14px; width:100%; font-size:1.02rem; padding:.8rem 1rem; }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar-mount"></aside>
  <main class="main">
    <div class="topbar"><h1>Download Micro Plan</h1></div>
    <p class="muted">The pre-campaign planning documents: each Area Incharge's <b>AIC Summary</b> and <b>area map</b>, every team's <b>micro plan</b> and its <b>route maps</b> (one full landscape page per map). Reporting forms such as 2A are not part of this download.</p>
    <div class="dl-panel">
      <label for="campSel">Campaign</label><select id="campSel"></select>
      <div id="aicList" class="aic-list"></div>
      <button class="btn dlbtn" id="dlAll" style="display:none"><i class="bi bi-download"></i> Download all completed AICs (one PDF)</button>
      <div class="prog" id="prog"><div id="progBar"></div></div>
      <div id="msg" class="muted" role="status" aria-live="polite">Loading…</div>
    </div>
    <div class="pv" id="pv"><div class="pv-in"><div class="pv-top"><b id="pvTitle">Plan preview</b><div style="display:flex;gap:8px"><button class="btn" id="pvDl"><i class="bi bi-download"></i> Download PDF</button><button class="btn" id="pvClose">Close</button></div></div><div class="pv-body" id="pvBody"></div></div></div>
    <iframe id="hiddenFrame" style="position:absolute;left:-99999px;width:1200px;height:800px;border:0" aria-hidden="true"></iframe>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="../assets/js/config.js?v=20261014h"></script><script src="../assets/js/supabaseClient.js?v=20261014h"></script><script src="../assets/js/nav.js?v=20261014h"></script><script src="../assets/js/forms.js?v=20261014h"></script><script src="../assets/js/pdfx.js?v=20261014h"></script>
<script>
const $ = (id) => document.getElementById(id), E = (t) => FS.esc(t), sleep = (ms) => new Promise(r => setTimeout(r, ms)), natural = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true });
let B = null, me = null, frameReady = null, busy = false;
const say = (t, cls) => { const m = $("msg"); m.className = cls || "muted"; m.innerHTML = t; }, tick = (d, n) => { $("prog").style.display = "block"; $("progBar").style.width = Math.round(100 * d / Math.max(1, n)) + "%"; };
const isManager = () => me && ["admin", "ucmo"].includes(me.role), isAic = () => me && me.role === "aic" && !!me.staff_id;

(async () => {
  const session = await requireAuth(); if (!session) return; renderSidebar("download-micro-plan.html");
  { const { data: pr } = await supabaseClient.from("profiles").select("role, staff_id").eq("id", session.user.id).single(); me = pr || { role: "viewer" }; }
  if (!isManager() && !isAic()) { say("This download is for administrators, UCMOs and Area Incharges.", "err"); return; }
  const { data: cs } = await supabaseClient.from("campaigns").select("id, name, status").order("start_date", { ascending: false });
  $("campSel").innerHTML = (cs || []).map(c => `<option value="${c.id}">${E(c.name)}</option>`).join("") || `<option value="">No campaign yet</option>`;
  const act = (cs || []).find(c => c.status !== "closed"); if (act) $("campSel").value = act.id;
  $("campSel").onchange = loadCampaign; $("dlAll").onclick = () => download(B.aics.filter(a => a.done), true);
  if ($("campSel").value) await loadCampaign(); else say("No campaign yet.", "err");
})();
async function loadCampaign() {
  say("Loading campaign…"); $("aicList").innerHTML = ""; $("dlAll").style.display = "none";
  try { B = await FS.loadBase($("campSel").value); } catch (e) { say("Could not load the campaign: " + E(e.message || e), "err"); return; }
  let aics = (B.aics || []).slice().sort((a, b) => a.aic_no - b.aic_no); if (isAic()) aics = aics.filter(a => a.id === me.staff_id);   // permissions: only what the account may see
  const { data: fm } = await supabaseClient.from("campaign_forms").select("aic_staff_id, data").eq("campaign_id", B.campaign.id).eq("form_type", "plan_setup");
  const plan = Object.fromEntries((fm || []).map(f => [f.aic_staff_id, (f.data || {}).teams || {}]));
  aics.forEach(a => { const ts = FS.teamsOf(B, a.id); a.nTeams = ts.length; a.nDone = ts.filter(t => PS.teamDone((plan[a.id] || {})[t.team_no])).length; a.done = ts.length > 0 && a.nDone === ts.length; });
  B.aics = aics;
  $("aicList").innerHTML = aics.map(a => `<div class="aic-row"><div><b>AIC ${E(a.aic_no)} — ${E(a.full_name)}</b><small>${a.nTeams} team(s) · questionnaire answered for ${a.nDone} of ${a.nTeams}</small></div>
    <div style="display:flex;gap:10px;align-items:center"><span class="st ${a.done ? "ok" : "no"}">${a.done ? "Plan completed" : "Plan not completed"}</span>
    <button class="btn" data-view="${a.id}" ${a.done ? "" : "disabled"}><i class="bi bi-eye"></i> View plan</button>
    <button class="btn" data-aic="${a.id}" ${a.done ? "" : "disabled"} title="${a.done ? "Download this AIC's micro plan" : "Available once the plan is completed"}"><i class="bi bi-download"></i> Download</button></div></div>`).join("");
  $("aicList").querySelectorAll("button[data-aic]").forEach(b => b.onclick = () => download(aics.filter(a => a.id === b.dataset.aic), false));
  $("aicList").querySelectorAll("button[data-view]").forEach(b => b.onclick = () => view(aics.find(a => a.id === b.dataset.view)));
  const nd = aics.filter(a => a.done).length; $("dlAll").style.display = (!isAic() && nd > 1) ? "" : "none";
  const nt = aics.reduce((n, a) => n + a.nTeams, 0);
  say(aics.length ? `${aics.length} Area Incharge(s) and ${nt} team(s) in ${E(B.geo.uc || "this union council")} — ${nd} plan(s) completed.` : "No Area Incharge is available for this campaign.", aics.length ? "muted" : "err");
}

/* ---- the micro plan sheets come from the existing microplan page, loaded in a hidden frame ---- */
async function frame() {
  if (frameReady) return frameReady;
  frameReady = new Promise((resolve, reject) => {
    const f = $("hiddenFrame"); f.onload = async () => {
      try { const cw = f.contentWindow; for (let i = 0; i < 80; i++) { if (cw.eval && typeof cw.loadCampaign === "function" && cw.eval('document.getElementById("campSel").options.length') > 0) break; await sleep(250); }
        for (let i = 0; i < 120; i++) { if (cw.eval('typeof D !== "undefined" && !!D && aics.length > 0')) break; await sleep(250); }   // wait until the page has finished its own first load, or it overwrites ours
        if (!document.getElementById("mpcss")) { const css = [...f.contentDocument.querySelectorAll("style")].map(s => s.textContent).join("\n"); const st = document.createElement("style"); st.id = "mpcss"; st.textContent = css.replace(/@media print\s*\{[\s\S]*?\n\s*\}\s*\n/g, ""); document.head.appendChild(st); }
        resolve(cw); } catch (e) { reject(e); } };
    f.src = "microplan.html";
  });
  return frameReady;
}
async function microplanPages(cw, aicId, teamId) {
  await cw.eval(`(async()=>{ if ($("campSel").value !== "${B.campaign.id}") { $("campSel").value = "${B.campaign.id}"; await loadCampaign(); } $("aicSel").value = "${aicId}"; await load(); $("teamSel").value = "${teamId || ""}"; render(); })()`);
  const html = cw.eval('document.getElementById("board").innerHTML'), d = document.createElement("div"); d.innerHTML = html;
  d.querySelectorAll(".noprint").forEach(x => x.remove());
  if (!d.querySelector(".scroll")) { const er = cw.eval('document.getElementById("err").textContent'); console.warn("microplan frame", er, d.textContent.slice(0, 200)); if (er) throw new Error(er); }
  return [...d.querySelectorAll(".scroll")].map(x => x.outerHTML);
}

/* ---- ONE list of parts for any set of AICs: each AIC once, then his or her teams once ---- */
async function buildParts(aics, stats) {
  const cw = await frame(), parts = [], nd = FS.nDays(B), who = (a) => `AIC ${a.aic_no} - ${a.full_name}`;
  const { data: tm, error } = await supabaseClient.from("team_day_maps").select("team_id, campaign_day, storage_path").eq("campaign_id", B.campaign.id); if (error) throw error;
  const by = Object.fromEntries((tm || []).map(m => [m.team_id + "|" + m.campaign_day, m.storage_path]));
  for (const a of aics) {
    say(`Preparing ${E(who(a))}…`);
    const mp = await microplanPages(cw, a.id, ""); if (!mp.length) throw new Error(`The AIC Summary of ${who(a)} could not be prepared`);
    parts.push({ html: [mp[0]] }); stats.aics++;                                                                    // AIC Summary MP
    const areaImg = await FS.imgData("staff-documents", a.area_map_path); if (!areaImg) stats.missing.push(`${who(a)} area map`);
    parts.push({ image: areaImg, caption: `${who(a)} - AIC Area Map (8MP)` }); stats.maps++;                          // AIC area map, one full landscape page
    const teams = FS.teamsOf(B, a.id).slice().sort((x, y) => natural(x.team_no, y.team_no));
    for (const t of teams) {
      say(`Preparing ${E(who(a))} — Team ${E(t.team_no)}…`);
      const pg = await microplanPages(cw, a.id, t.id); if (pg.length) parts.push({ html: pg }); else stats.missing.push(`Team ${t.team_no} micro plan sheet`); stats.teams++;
      if (t.team_type === "mobile") for (let d = 1; d <= nd; d++) {                                                 // one route map per mobile team per day
        const img = await FS.imgData("operational-plans", by[t.id + "|" + d]); if (!img) stats.missing.push(`Team ${t.team_no} Day ${d} map`);
        parts.push({ image: img, caption: `${who(a)} - Team ${t.team_no} - Day ${d} Route Map (7MP)` }); stats.maps++;
      }
    }
  }
  return parts;
}
async function view(a) {
  if (busy || !a) return; busy = true; $("pv").classList.add("on"); $("pvTitle").textContent = `AIC ${a.aic_no} — ${a.full_name}: full plan preview`; $("pvBody").innerHTML = '<div class="pv-miss" style="color:inherit">Preparing the preview…</div>';
  $("pvDl").onclick = () => { $("pv").classList.remove("on"); download([a], false); }; $("pvClose").onclick = () => $("pv").classList.remove("on");
  try {
    const parts = await buildParts([a], { aics: 0, teams: 0, maps: 0, missing: [] });
    $("pvBody").innerHTML = parts.map(p => p.html ? `<div class="pv-pg">${p.html.join("")}</div>`
      : `<div class="pv-pg"><div class="pv-cap">${E(p.caption)}</div>${p.image ? `<img src="${p.image}" alt="">` : '<div class="pv-miss">Picture not uploaded yet</div>'}</div>`).join("");
    say(`Preview ready — ${parts.length} page(s).`, "ok");
  } catch (e) { $("pvBody").innerHTML = `<div class="pv-miss">Could not prepare the preview: ${E(e.message || e)}</div>`; }
  finally { busy = false; }
}
const safe = (s) => String(s || "").replace(/[^\w\-]+/g, "_").replace(/^_+|_+$/g, "");
async function download(aics, all) {
  if (busy || !B || !aics.length) return; const one = !all;
  busy = true; document.querySelectorAll("#aicList button, #dlAll").forEach(x => x.disabled = true); tick(0, 1); const stats = { aics: 0, teams: 0, maps: 0, missing: [] };
  const base = `${safe(B.campaign.name)}_${safe(B.geo.uc)}`, filename = one ? `${base}_AIC${aics[0].aic_no}_${safe(aics[0].full_name)}_MicroPlan.pdf` : `${base}_Completed_AICs_and_Teams_MicroPlan.pdf`;
  try {
    const parts = await buildParts(aics, stats); let pages = 0;
    await PDFX.download({ filename, say: (t, err) => { if (err) throw new Error(t); }, makeBytes: async () => { const b = await PDFX.assemble(parts, { onProgress: (d, n) => { tick(d, n); say(`Assembling the PDF… ${d} of ${n} parts`); } }); pages = parts.length; return b; } });
    say(`Downloaded <b>${E(filename)}</b> — ${stats.aics} Area Incharge(s), ${stats.teams} team(s), ${stats.maps} map page(s).` + (stats.missing.length ? `<br><span class="err">Not uploaded yet (shown as marked placeholder pages): ${E(stats.missing.join("; "))}</span>` : ""), stats.missing.length ? "muted" : "ok");
  } catch (e) { say("The download did not complete: " + E(e.message || e) + " Please try again.", "err"); }
  finally { busy = false; document.querySelectorAll("#aicList button[data-aic], #aicList button[data-view]").forEach(x => x.disabled = !B.aics.find(a => a.id === (x.dataset.aic || x.dataset.view)).done); $("dlAll").disabled = false; tick(1, 1); setTimeout(() => $("prog").style.display = "none", 800); }
}
</script>
</body>
</html>
