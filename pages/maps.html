<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maps — Polio Campaign Dashboard</title>
<link rel="stylesheet" href="../assets/css/style.css?v=20261013g">
<style>
  .sheet { background:#fff; border:2px solid #1b2430; border-radius:6px; margin:0 0 1.2rem; padding:.6rem; }
  .sheet h2 { margin:0 0 .4rem; font-size:1.25rem; font-weight:800; display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
  .sheet .meta { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:.2rem .8rem; font-weight:700; font-size:1rem; margin-bottom:.5rem; border-bottom:2px solid #1b2430; padding-bottom:.4rem; }
  .sheet .pic { width:100%; height:62vh; display:flex; align-items:center; justify-content:center; background:#f6f7f5; border:1px dashed #9aa5a0; }
  .sheet .pic img { max-width:100%; max-height:100%; object-fit:contain; }
  .sheet .sign { display:flex; justify-content:space-between; margin-top:.6rem; font-weight:700; }
  .missing { color:#9b1c1c; font-weight:700; }
  .bar { display:flex; gap:.6rem; flex-wrap:wrap; align-items:flex-end; margin-bottom:1rem; }
  .bar label { display:block; font-weight:600; font-size:.85rem; }
  @media print {
    @page { size: A4 landscape; margin: 8mm; }
    .sidebar, .topbar, .bar, .noprint, .muted { display:none !important; }
    .app-shell { display:block !important; } .main { padding:0 !important; margin:0 !important; }
    .sheet { page-break-after:always; break-after:page; border-width:2px; margin:0; padding:4mm; height:196mm; display:flex; flex-direction:column; }
    .sheet:last-child { page-break-after:auto; break-after:auto; }
    .sheet h2 { font-size:20pt; } .sheet .meta { font-size:13pt; }
    .sheet .pic { flex:1; height:auto; border:none; background:#fff; }
    .sheet .sign { font-size:13pt; }
    .sheet.hide { display:none !important; }
  }
  @media (max-width:700px){ .sheet .pic{height:45vh;} }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar-mount"></aside>
  <main class="main">
    <div class="topbar"><h1>Maps (print)</h1></div>
    <p class="muted">Prints the map pictures already uploaded in Staff Management (UC map, AIC area map) and Operational Plan (day maps) on the 2026 format pages: UC Map 12MP, AIC Map 8MP and Route Map 7MP (Days 1–3). Upload or replace pictures on those pages; nothing is uploaded here.</p>
    <div class="bar">
      <div><label>Campaign</label><select id="campSel"></select></div>
      <div><label>Area Incharge</label><select id="aicSel"></select></div>
      <label class="noprint" style="display:flex;gap:.3rem;align-items:center;"><input type="checkbox" id="allAics"> Print all Area Incharges</label>
      <button class="btn" onclick="window.print()">Print / Save as PDF</button>
    </div>
    <div id="out"><p class="muted">Loading…</p></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js?v=20261013g"></script>
<script src="../assets/js/supabaseClient.js?v=20261013g"></script>
<script src="../assets/js/nav.js?v=20261013g"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let camps = [], campaign = null, ucName = "", ucmo = null, aics = [], me = null;

async function url(bucket, path) {
  if (!path) return null;
  const { data } = await supabaseClient.storage.from(bucket).createSignedUrl(path, 3600);
  return data?.signedUrl || null;
}
(async () => {
  const session = await requireAuth(); if (!session) return; renderSidebar("maps.html");
  const { data: p } = await supabaseClient.from("profiles").select("role, staff_id, uc_id").eq("id", session.user.id).single(); me = p || { role: "viewer" };
  const { data: cs } = await supabaseClient.from("campaigns").select("id, name, uc_id, start_date").order("start_date", { ascending: false }); camps = cs || [];
  $("campSel").innerHTML = camps.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("") || `<option value="">No campaign yet</option>`;
  $("campSel").onchange = loadCampaign; $("aicSel").onchange = render; $("allAics").onchange = render;
  if (camps.length) await loadCampaign(); else $("out").innerHTML = `<p class="muted">No campaign yet.</p>`;
})();

async function loadCampaign() {
  campaign = camps.find(c => c.id === $("campSel").value); if (!campaign) return;
  const { data: uc } = campaign.uc_id ? await supabaseClient.from("union_councils").select("name").eq("id", campaign.uc_id).single() : { data: null }; ucName = uc?.name || "";
  const { data: um } = await supabaseClient.from("staff").select("id, full_name, area_map_path").eq("designation", "ucmo").eq("uc_id", campaign.uc_id).eq("status", "active").limit(1); ucmo = (um || [])[0] || null;
  const { data } = await supabaseClient.from("staff").select("id, full_name, aic_no, area_map_path, uc_id").eq("designation", "aic").eq("status", "active").order("aic_no"); aics = data || [];
  $("aicSel").innerHTML = aics.map(a => `<option value="${a.id}">AIC ${a.aic_no} — ${esc(a.full_name)}</option>`).join("") || `<option value="">No Area Incharge</option>`;
  if (me.role === "aic" && me.staff_id) { $("aicSel").value = me.staff_id; $("aicSel").disabled = true; $("allAics").parentElement.style.display = "none"; }
  await render();
}

function sheet(code, title, urdu, imgUrl, extra) {
  return `<section class="sheet"><h2><span>${esc(title)} <small>(${code})</small></span><span dir="rtl">${urdu}</span></h2>
    <div class="meta"><div>Campaign: ${esc(campaign.name)}</div><div>Union Council: ${esc(ucName)}</div>${extra}</div>
    <div class="pic">${imgUrl ? `<img src="${imgUrl}" alt="${esc(title)}">` : `<span class="missing">Map picture not uploaded yet</span>`}</div>
    <div class="sign"><span>Prepared by: ____________________</span><span>Signature / Date: ____________________</span></div></section>`;
}

async function render() {
  if (!campaign) return;
  $("out").innerHTML = `<p class="muted">Loading maps…</p>`;
  let html = "";
  const ucUrl = await url("staff-documents", ucmo?.area_map_path);
  html += sheet("12MP", "UC Map", "یونین کونسل کا نقشہ", ucUrl, `<div>UCMO: ${esc(ucmo?.full_name || "—")}</div>`);
  const sel = $("allAics").checked ? aics : aics.filter(a => a.id === $("aicSel").value);
  for (const a of sel) {
    const { data: dm } = await supabaseClient.from("operational_day_maps").select("campaign_day, storage_path").eq("campaign_id", campaign.id).eq("aic_staff_id", a.id);
    const byDay = Object.fromEntries((dm || []).map(m => [m.campaign_day, m.storage_path]));
    const who = `<div>Area Incharge: AIC ${a.aic_no} — ${esc(a.full_name)}</div>`;
    html += sheet("8MP", "AIC Area Map (all teams, coloured)", "ایریا انچارج کا نقشہ", await url("staff-documents", a.area_map_path), who);
    for (const d of [1, 2, 3]) html += sheet("7MP", `Route Map — Day ${d}`, `ٹیم روٹ نقشہ — دن ${d}`, await url("operational-plans", byDay[d]), who + `<div>Day: ${d}</div>`);
  }
  $("out").innerHTML = html;
}
</script>
</body>
</html>
