<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporting — Polio Campaign Dashboard</title>
<link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/forms.css">
<style> #pp { display:none; } .grid td input { width:68px; padding:4px 5px; text-align:center; } .grid th { white-space:normal; min-width:62px; font-size:.68rem; } .saved { color:var(--ok); font-weight:700; }
  @media print { .entry { display:none !important; } #pp { display:block !important; } } </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar-mount"></aside>
  <main class="main">
    <div class="topbar"><h1>Reporting — active campaign</h1></div>
    <div class="entry">
      <p class="muted">Enter what each of your teams actually did, day by day. Anything not entered counts as 0. Save, then download the 2A form of your area. The UCMO's 2B form updates automatically from what you save.</p>
      <div class="dl-panel"><div class="dl-row">
        <div><label>Campaign</label><select id="campSel"></select></div>
        <div><label>Area Incharge</label><select id="aicSel"></select></div>
        <div><label>Day</label><select id="daySel"></select></div>
        <div><label>Catch-up day?</label><select id="cuSel"><option value="0">No</option><option value="1">Yes</option></select></div>
      </div><div id="msg" class="muted" style="margin-top:6px"></div></div>
      <div class="card"><div class="table-wrap"><div id="grid"><p class="muted">Loading…</p></div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn" id="saveBtn"><i class="bi bi-save"></i> Save report</button>
          <button class="btn secondary" id="pdfDay"><i class="bi bi-file-earmark-pdf"></i> Download 2A — this day</button>
          <button class="btn secondary" id="pdfAll"><i class="bi bi-file-earmark-pdf"></i> Download 2A — all days</button>
          <button class="btn secondary" id="printBtn"><i class="bi bi-printer"></i> Print</button></div></div>
    </div>
    <div id="pp"></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="../assets/js/config.js"></script><script src="../assets/js/supabaseClient.js"></script><script src="../assets/js/nav.js"></script><script src="../assets/js/forms.js"></script>
<script>
const $ = (id) => document.getElementById(id), E = FS.esc;
let B = null, me = null, uid = null, draft = {};
const curAic = () => B.aics.find(a => a.id === $("aicSel").value), curDay = () => Number($("daySel").value) || 1, curCU = () => $("cuSel").value === "1";
(async () => {
  const session = await requireAuth(); if (!session) return; renderSidebar("reporting.html"); uid = session.user.id;
  { const { data: pr } = await supabaseClient.from("profiles").select("role, staff_id").eq("id", uid).single(); me = pr || { role: "viewer" }; }
  const { data: cs } = await supabaseClient.from("campaigns").select("id, name, status").order("start_date", { ascending: false }), list = cs || [];
  $("campSel").innerHTML = list.map(c => `<option value="${c.id}">${E(c.name)}${c.status === "closed" ? " (closed)" : ""}</option>`).join("") || `<option value="">No campaign yet</option>`;
  const act = list.find(c => c.status !== "closed"); if (act) $("campSel").value = act.id;
  $("campSel").onchange = load; $("aicSel").onchange = () => { draft = {}; draw(); }; $("daySel").onchange = $("cuSel").onchange = () => { draft = {}; draw(); };
  $("grid").addEventListener("input", (e) => { const k = e.target.dataset.k; if (!k) return; const [tn, f] = k.split("|"); (draft[tn] = draft[tn] || {})[f] = e.target.value; $("msg").textContent = "Unsaved changes"; });
  $("saveBtn").onclick = save; $("printBtn").onclick = () => { build([curDay()]); setTimeout(() => window.print(), 300); };
  $("pdfDay").onclick = () => pdf([curDay()]); $("pdfAll").onclick = () => pdf(days());
  if ($("campSel").value) await load(); else $("grid").innerHTML = `<p class="muted">Create a campaign first.</p>`;
})();
const days = () => Array.from({ length: Math.min(Math.max(parseInt(B.campaign.total_days) || 3, 1), 7) }, (_, i) => i + 1);
async function load() {
  $("grid").innerHTML = `<p class="muted">Loading…</p>`; B = await FS.loadBase($("campSel").value);
  $("aicSel").innerHTML = B.aics.map(a => `<option value="${a.id}">AIC ${E(a.aic_no)} — ${E(a.full_name)}</option>`).join("") || `<option value="">No Area Incharge</option>`;
  if (me.role === "aic" && me.staff_id) { $("aicSel").value = me.staff_id; $("aicSel").disabled = true; }
  $("daySel").innerHTML = days().map(d => `<option value="${d}">Day ${d} — ${FS.dayDate(B, d)}</option>`).join(""); draft = {}; draw();
}
function draw() {
  const a = curAic(); if (!a) { $("grid").innerHTML = `<p class="muted">No Area Incharge found.</p>`; return; }
  const ts = FS.teamsOf(B, a.id), cols = FS.rcols(B), day = curDay(), cu = curCU();
  if (!ts.length) { $("grid").innerHTML = `<p class="muted">This Area Incharge has no teams yet.</p>`; return; }
  $("grid").innerHTML = `<table class="fx grid"><thead><tr><th>Team</th><th>Target HH</th><th>Target children</th>${cols.map(c => `<th>${c[1]}</th>`).join("")}</tr></thead><tbody>${ts.map(t => { const r = FS.rep(B, t.team_no, day, cu) || {}, g = FS.tgt(B, t.team_no, day) || {};
    return `<tr><td><b>${E(t.team_no)}</b><br><small>${E(t.team_type || "")}</small></td><td>${g.target_households ?? 0}</td><td>${g.target_children ?? 0}</td>${cols.map(c => `<td><input type="number" min="0" data-k="${E(t.team_no)}|${c[0]}" value="${E((draft[t.team_no] || {})[c[0]] ?? r[c[0]] ?? 0)}"></td>`).join("")}</tr>`; }).join("")}</tbody></table>`;
  $("msg").textContent = `${ts.length} team(s) · Day ${day}${cu ? " (catch-up)" : ""}`;
}
async function save() {
  const a = curAic(); if (!a) return; $("saveBtn").disabled = true; const ts = FS.teamsOf(B, a.id), cols = FS.rcols(B), day = curDay(), cu = curCU(), rows = [];
  ts.forEach(t => { const d = draft[t.team_no] || {}, r = FS.rep(B, t.team_no, day, cu) || {}, g = FS.tgt(B, t.team_no, day) || {}, row = { campaign_id: B.campaign.id, team_no: Number(t.team_no), campaign_day: day, is_catchup: cu, households_target: g.target_households || 0, reported_by: uid };
    cols.forEach(c => { const v = d[c[0]] ?? r[c[0]] ?? 0; row[c[0]] = Math.max(0, Number(v) || 0); }); rows.push(row); });
  const { data, error } = await supabaseClient.from("daily_reports").upsert(rows, { onConflict: "campaign_id,team_no,campaign_day,is_catchup" }).select();
  if (error) $("msg").innerHTML = `<span class="error-text">Could not save: ${E(error.message)}</span>`;
  else { (data || []).forEach(n => { const i = B.reports.findIndex(x => String(x.team_no) === String(n.team_no) && x.campaign_day === n.campaign_day && !!x.is_catchup === !!n.is_catchup); if (i >= 0) B.reports[i] = n; else B.reports.push(n); }); draft = {}; draw(); $("msg").innerHTML = `<span class="saved">Saved ✓ — the UCMO's 2B form is updated.</span>`; }
  $("saveBtn").disabled = false;
}
function build(ds) { const a = curAic(); if (!a) return []; const pages = []; ds.forEach(d => { pages.push(FS.render2AAic(B, a, d, false)); if ((B.reports || []).some(r => r.campaign_day === d && r.is_catchup && FS.teamsOf(B, a.id).some(t => String(t.team_no) === String(r.team_no)))) pages.push(FS.render2AAic(B, a, d, true)); }); $("pp").innerHTML = pages.join(""); return pages; }
async function pdf(ds) {
  const a = curAic(); if (!a) return; const pages = build(ds); $("msg").textContent = "Creating PDF…";
  const box = document.createElement("div"); box.style.cssText = "position:fixed;left:-99999px;top:0;width:1123px;background:#fff"; box.innerHTML = pages.map((h, i) => `<div style="${i ? "break-before:page;" : ""}">${h}</div>`).join(""); document.body.appendChild(box);
  await html2pdf().set({ margin: [3, 3, 3, 3], filename: `2A_AIC${a.aic_no}_${ds.length > 1 ? "all_days" : "Day" + ds[0]}.pdf`, image: { type: "jpeg", quality: .95 }, html2canvas: { scale: 2, windowWidth: 1123 }, jsPDF: { unit: "mm", format: "a4", orientation: "landscape" }, pagebreak: { mode: ["css", "avoid-all"] } }).from(box).save();
  box.remove(); $("msg").textContent = "PDF downloaded.";
}
</script>
</body>
</html>
