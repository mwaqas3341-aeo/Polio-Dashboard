<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan questionnaire — Polio Campaign Dashboard</title>
<link rel="stylesheet" href="../assets/css/style.css?v=20261013c">
<style>
  .yn { display:inline-flex; gap:6px; } .yn button { border:1.5px solid var(--b0); background:#fff; border-radius:999px; padding:5px 18px; font-weight:800; cursor:pointer; font-size:.85rem; color:var(--t2); }
  .yn button.on-yes { background:var(--ok); border-color:var(--ok); color:#fff; } .yn button.on-no { background:var(--t2); border-color:var(--t2); color:#fff; }
  .q { padding:10px 0; border-bottom:1px dashed var(--b0); } .q:last-child { border-bottom:0; } .q .qt { font-weight:700; margin-bottom:6px; }
  .sub { margin:8px 0 2px 14px; padding:10px 12px; background:var(--brand-light); border-radius:var(--r2); display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:8px 12px; }
  .teamcard { border-top:4px solid var(--accent); } .teamcard.done { border-top-color:var(--ok); }
  .pbar { height:10px; background:var(--s2); border-radius:99px; overflow:hidden; } .pbar i { display:block; height:100%; background:linear-gradient(90deg,var(--brand),var(--ok)); width:0; transition:width .3s; }
  .st { font-size:.8rem; font-weight:700; } .st.ok { color:var(--ok); } .st.todo { color:var(--warn); }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar-mount"></aside>
  <main class="main">
    <div class="topbar"><h1>Plan questionnaire</h1><span class="who" id="who"></span></div>
    <p class="muted">Answer these questions first. Each team's details are only asked when the answer is Yes. When everything is answered, the rest of Plan Management opens. Answers save automatically.</p>
    <div class="card"><div class="form-grid"><div><label>Campaign</label><select id="campSel"></select></div><div><label>Area Incharge</label><select id="aicSel"></select></div></div>
      <div style="margin-top:12px"><div class="pbar"><i id="pbar"></i></div><div class="muted" id="ptxt" style="margin-top:4px"></div></div>
      <div id="doneBox"></div></div>
    <div class="section-title"><i class="bi bi-capsule"></i> Campaign question <div class="title-line"></div></div>
    <div class="card" id="capsCard"></div>
    <div class="section-title"><i class="bi bi-people"></i> Team questions <div class="title-line"></div></div>
    <div id="teams"><p class="muted">Loading…</p></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js?v=20261013c"></script><script src="../assets/js/supabaseClient.js?v=20261013c"></script><script src="../assets/js/nav.js?v=20261013c"></script><script src="../assets/js/forms.js?v=20261013c"></script>
<script>
const $ = (id) => document.getElementById(id), E = FS.esc;
let B = null, me = null, mmpCnt = {}, canCaps = false, saveT = {};
const TYPE = { mobile: "Mobile", fixed: "Fixed", transit: "Transit" };
(async () => {
  const session = await requireAuth(); if (!session) return; renderSidebar("plan-setup.html");
  { const { data: pr } = await supabaseClient.from("profiles").select("role, staff_id").eq("id", session.user.id).single(); me = pr || { role: "viewer" }; }
  canCaps = ["admin", "district_coordinator", "ucmo"].includes(me.role);
  const { data: cs } = await supabaseClient.from("campaigns").select("id, name").order("start_date", { ascending: false });
  $("campSel").innerHTML = (cs || []).map(c => `<option value="${c.id}">${E(c.name)}</option>`).join("") || `<option value="">No campaign yet</option>`;
  $("campSel").onchange = load; $("aicSel").onchange = draw;
  $("capsCard").addEventListener("click", capsClick); $("capsCard").addEventListener("input", capsInput);
  $("teams").addEventListener("click", teamClick); $("teams").addEventListener("input", teamInput);
  if ($("campSel").value) await load();
})();
async function load() {
  B = await FS.loadBase($("campSel").value);
  const { data: m } = await supabaseClient.from("mmp_assignments").select("team_no").eq("campaign_id", B.campaign.id); mmpCnt = {}; (m || []).forEach(r => mmpCnt[r.team_no] = (mmpCnt[r.team_no] || 0) + 1);
  $("aicSel").innerHTML = `<option value="">All Area Incharges</option>` + B.aics.map(a => `<option value="${a.id}">AIC ${E(a.aic_no)} — ${E(a.full_name)}</option>`).join("");
  if (me.role === "aic" && me.staff_id) { $("aicSel").value = me.staff_id; $("aicSel").disabled = true; }
  draw();
}
const caps = () => FS.getForm(B, "campaign_setup", null);
const ansOf = (aic, tn) => (((FS.getForm(B, "plan_setup", aic) || {}).teams || {})[tn]) || {};
function yn(attr, cur, dis) { return `<span class="yn"><button type="button" ${dis ? "disabled" : ""} ${attr} data-v="yes" class="${cur === "yes" ? "on-yes" : ""}">Yes</button><button type="button" ${dis ? "disabled" : ""} ${attr} data-v="no" class="${cur === "no" ? "on-no" : ""}">No</button></span>`; }
function drawCaps() {
  const c = caps(), dis = !canCaps;
  $("capsCard").innerHTML = `<div class="q"><div class="qt">Will Vitamin A capsules (Blue and Red) be needed in this campaign?</div>${yn('data-cq="1"', c.vit_a_needed, dis)}
    ${c.vit_a_needed === "yes" ? `<div class="sub"><div><label>Blue capsules needed (quantity)</label><input type="number" min="0" data-cf="vit_blue" value="${E(c.vit_blue ?? "")}" ${dis ? "disabled" : ""}></div><div><label>Red capsules needed (quantity)</label><input type="number" min="0" data-cf="vit_red" value="${E(c.vit_red ?? "")}" ${dis ? "disabled" : ""}></div></div>` : ""}
    ${dis ? `<p class="muted">Only the UCMO or an admin can answer this campaign-level question.</p>` : ""}<div class="st ${PS.capsDone(c) ? "ok" : "todo"}" style="margin-top:6px">${PS.capsDone(c) ? "✓ Answered" : "Not answered yet"}</div></div>`;
}
function capsClick(e) { const b = e.target.closest("[data-cq]"); if (!b || !canCaps) return; FS.draft(B, "campaign_setup", null, d => { d.vit_a_needed = b.dataset.v; if (d.vit_a_needed === "no") { delete d.vit_blue; delete d.vit_red; } }); drawCaps(); persist("campaign_setup", null); stats(); }
function capsInput(e) { const k = e.target.dataset.cf; if (!k || !canCaps) return; FS.draft(B, "campaign_setup", null, d => { d[k] = e.target.value; }); persist("campaign_setup", null); stats(); }
function micro(t) {
  if (t.team_type === "mobile") { const done = [1, 2, 3].filter(d => { const p = B.plans.find(x => x.team_id === t.id && x.campaign_day === d); return p && p.village_area && p.total_households != null && p.total_children != null; }).length; return { done, of: 3, link: "operational-plan.html" }; }
  const done = [1, 2, 3].filter(d => { const p = B.ft.find(x => x.team_id === t.id && x.campaign_day === d); return p && p.place_name && p.expected_children != null; }).length; return { done, of: 3, link: "fixed-transit-plan.html" };
}
function teamCard(a, t) {
  const A = ansOf(a.id, t.team_no), tn = E(t.team_no), key = (k) => `data-t="${tn}|${a.id}|${k}"`, dis = false, done = PS.teamDone(A), mp = micro(t);
  const num = (k, lbl) => `<div><label>${lbl}</label><input type="number" min="0" data-tf="${tn}|${a.id}|${k}" value="${E(A[k] ?? "")}"></div>`;
  return `<div class="card teamcard ${done ? "done" : ""}"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div><b>Team ${tn}</b> <span class="tag">${TYPE[t.team_type] || "Type not set"}</span> <span class="muted">AIC ${E(a.aic_no)} — ${E(a.full_name)}</span></div><span class="st ${done ? "ok" : "todo"}">${done ? "✓ Answered" : "Questions pending"}</span></div>
  <div class="q"><div class="qt">1. Is there a Migrant / Mobile Population (MMP) in this team's area?</div>${yn(key("mmp"), A.mmp)}
    ${A.mmp === "yes" ? `<div class="sub">${num("mmp_hh", "MMP households")}${num("mmp_children", "MMP children (under 5)")}<div class="muted">MMP entries saved so far: <b>${mmpCnt[t.team_no] || 0}</b> · <a href="mmp.html">open MMP list</a></div></div>` : ""}</div>
  <div class="q"><div class="qt">2. Are there schools / madaris with under-5 children in this team's area?</div>${yn(key("schools"), A.schools)}
    ${A.schools === "yes" ? `<div class="sub">${num("school_n", "Number of schools")}${num("madaris_n", "Number of madaris")}${num("school_children", "Under-5 children in them")}<div class="muted"><a href="schools.html">open school list</a></div></div>` : ""}</div>
  <div class="q"><div class="qt">3. Are there missed children carried forward from the last campaign?</div>${yn(key("missed"), A.missed)}
    ${A.missed === "yes" ? `<div class="sub">${num("missed_n", "Number of missed children")}<div class="muted"><a href="missed-children.html">open missed children</a></div></div>` : ""}</div>
  <div class="q"><div class="qt">4. Are there refusal households in this team's area?</div>${yn(key("refusal"), A.refusal)}
    ${A.refusal === "yes" ? `<div class="sub">${num("refusal_n", "Number of refusal households")}</div>` : ""}</div>
  <div class="q"><div class="qt">5. Micro plan (last step) — day-wise plan of this team</div><div class="st ${mp.done === mp.of ? "ok" : "todo"}">${mp.done} of ${mp.of} days filled in</div> <a class="btn small" href="${mp.link}">${mp.done === mp.of ? "Review" : "Fill in"} the micro plan</a><span class="muted"> (opens after all questions above are answered)</span></div></div>`;
}
function draw() {
  if (!B) return; drawCaps();
  const sel = $("aicSel").value, aics = B.aics.filter(a => !sel || a.id === sel);
  $("teams").innerHTML = aics.map(a => { const ts = FS.teamsOf(B, a.id); return ts.length ? ts.map(t => teamCard(a, t)).join("") : `<div class="card muted">AIC ${E(a.aic_no)} — ${E(a.full_name)} has no teams yet. Add teams in Staff Management.</div>`; }).join("") || `<div class="card muted">No Area Incharges found for this campaign's union council.</div>`;
  stats();
}
function teamClick(e) { const b = e.target.closest("[data-t]"); if (!b) return; const [tn, aic, k] = b.dataset.t.split("|"), val = b.dataset.v; FS.draft(B, "plan_setup", aic, d => { d.teams = d.teams || {}; const t = (d.teams[tn] = d.teams[tn] || {}); t[k] = val; if (val === "no") ({ mmp: ["mmp_hh", "mmp_children"], schools: ["school_n", "madaris_n", "school_children"], missed: ["missed_n"], refusal: ["refusal_n"] })[k].forEach(f => delete t[f]); });
  const y = window.scrollY; draw(); window.scrollTo(0, y); persist("plan_setup", aic); }
function teamInput(e) { const k = e.target.dataset.tf; if (!k) return; const [tn, aic, f] = k.split("|"); FS.draft(B, "plan_setup", aic, d => { d.teams = d.teams || {}; (d.teams[tn] = d.teams[tn] || {})[f] = e.target.value; }); persist("plan_setup", aic); stats(true); }
function persist(type, aic) { const k = type + "|" + (aic || ""); clearTimeout(saveT[k]); $("ptxt").textContent = "Saving…";
  saveT[k] = setTimeout(async () => { try { await FS.saveForm(B, type, aic, FS.getForm(B, type, aic)); PS._g = null; $("ptxt").dataset.saved = "1"; stats(); } catch (e) { $("ptxt").innerHTML = `<span class="error-text">Could not save: ${E(e.message || e)}</span>`; } }, 700); }
function stats(light) {
  let total = 0, done = 0; B.aics.forEach(a => FS.teamsOf(B, a.id).forEach(t => { total++; if (PS.teamDone(ansOf(a.id, t.team_no))) done++; }));
  const capsOk = PS.capsDone(caps()), all = total + 1, d = done + (capsOk ? 1 : 0);
  $("pbar").style.width = (all ? Math.round(d * 100 / all) : 0) + "%"; if (!$("ptxt").textContent.startsWith("Could not")) $("ptxt").textContent = `${d} of ${all} questions sections answered (${done} of ${total} teams${capsOk ? ", capsule question done" : ", capsule question pending"}) — answers save automatically`;
  $("doneBox").innerHTML = (capsOk && done === total && total) ? `<div style="margin-top:10px"><b style="color:var(--ok)">✓ All questions answered — Plan Management is unlocked.</b> <a class="btn small" href="operational-plan.html">Go to the Operational Plan</a></div>` : "";
}
</script>
</body>
</html>
