<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff — Polio Campaign Dashboard</title>
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  .hdr { display:flex; gap:1rem; flex-wrap:wrap; align-items:flex-end; }
  .hdr > div { min-width:14rem; flex:1; }
  .board .ucmo { border:2px solid #1a7f5a; border-radius:var(--radius); padding:.8rem 1rem; background:#f2faf6; }
  .big { font-size:1.05rem; font-weight:600; }
  .bar { height:.5rem; background:#e3e8e6; border-radius:99px; overflow:hidden; margin:.2rem 0 .5rem; } .bar i { display:block; height:100%; background:#1a7f5a; }
  .aic { border:1px solid var(--line); border-radius:var(--radius); margin:.7rem 0; padding:.7rem .9rem; background:#fff; }
  .aic.empty { background:#fafafa; border-style:dashed; display:flex; justify-content:space-between; align-items:center; color:#666; }
  .team { border-top:1px dashed var(--line); padding:.5rem 0; }
  .team .slots { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; margin-top:.3rem; }
  @media (max-width:640px) { .team .slots { grid-template-columns:1fr; } }
  .slot { border:1px solid var(--line); border-radius:8px; padding:.45rem .6rem; background:#fbfcfc; font-size:.92rem; }
  .slot.free { border-style:dashed; color:#777; display:flex; justify-content:space-between; align-items:center; }
  .tag { display:inline-block; padding:.1rem .5rem; border-radius:99px; font-size:.75rem; background:#e8efed; margin-left:.3rem; }
  .btn.small { padding:.25rem .65rem; font-size:.85rem; } .btn.ghost { background:#fff; color:inherit; border:1px solid var(--line); }
  .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); overflow:auto; padding:1rem; z-index:50; }
  .panel { background:#fff; max-width:760px; margin:0 auto; padding:1rem 1.2rem 1.4rem; border-radius:12px; }
  .panel h2 { margin-top:0; }
  .sect { border:1px solid var(--line); border-radius:var(--radius); padding:.8rem; margin-top:.9rem; background:#fbfcfc; }
  .sect h3 { margin:0 0 .5rem; font-size:1rem; }
  .chips span { display:inline-block; margin:.15rem .3rem .15rem 0; padding:.15rem .55rem; border-radius:999px; font-size:.8rem; background:#eee; }
  .chips .good { background:#dff3e8; color:#14633f; } .chips .bad { background:#fde2e1; color:#9b1c1c; } .chips .na { background:#eef0f2; color:#555; }
  .types { display:flex; gap:.6rem; flex-wrap:wrap; } .types button { flex:1; min-width:6rem; padding:.7rem; border:2px solid var(--line); border-radius:10px; background:#fff; cursor:pointer; font-size:1rem; }
  .types button.sel { border-color:#1a7f5a; background:#e6f5ee; font-weight:600; }
  .numgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(3rem,1fr)); gap:.3rem; }
  .numgrid button { padding:.4rem 0; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; }
  .numgrid button.taken { background:#f1d6d6; color:#888; cursor:not-allowed; text-decoration:line-through; } .numgrid button.sel { background:#1a7f5a; color:#fff; }
  .docbox { display:inline-block; vertical-align:top; margin:.4rem 1rem .4rem 0; min-width:15rem; }
  .docbox img { max-width:100%; width:85.6mm; height:auto; border:1px solid #999; border-radius:3mm; display:block; margin:.3rem 0; }
  .radios label { display:block; font-weight:normal; margin:.25rem 0; }
  details.more { margin-top:.6rem; } details.more summary { cursor:pointer; color:#1a7f5a; }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar-mount"></aside>
  <main class="main">
    <div class="topbar"><h1>Staff</h1></div>

    <div class="card">
      <div class="hdr">
        <div><label>Union council</label><select id="ucSel"></select></div>
        <div><label>Working in campaign</label><select id="campSel"></select></div>
      </div>
      <p class="muted" style="margin:.6rem 0 0;">Staff, Area Incharges and teams stay in the system from one campaign to the next. When a new campaign starts, everyone carries over — just change what is different.</p>
    </div>

    <div class="board" id="board"><div class="card"><p class="muted">Loading…</p></div></div>

    <div class="card">
      <details id="waitBox"><summary class="big">People not on a team (waiting list, left, replaced)</summary><div id="waitList" class="muted" style="margin-top:.6rem;">Loading…</div></details>
    </div>
    <div class="card">
      <details id="findBox"><summary class="big">Find any staff member</summary>
        <div class="form-grid" style="margin-top:.6rem;">
          <div><label>Type</label><select id="fDes"><option value="">All</option><option value="ucmo">UCMO</option><option value="aic">Area Incharge</option><option value="team_member">Team Member</option><option value="driver">Driver</option></select></div>
          <div><label>Status</label><select id="fStatus"><option value="">All</option><option value="active">Active</option><option value="reserve">Reserve</option><option value="left_campaign">Left campaign</option><option value="replaced">Replaced</option><option value="transferred">Transferred</option><option value="inactive">Inactive</option></select></div>
          <div><label>Name or CNIC</label><input id="fQ" placeholder="search"></div>
        </div>
        <div class="table-wrap"><table><thead><tr><th>Name</th><th>Type</th><th>CNIC</th><th>Cell</th><th>Team</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
        <button class="btn ghost small" id="prevP">‹ Previous</button> <span class="muted" id="pageInfo"></span> <button class="btn ghost small" id="nextP">Next ›</button>
      </details>
    </div>
    <datalist id="bankList"></datalist>
  </main>
</div>

<div class="overlay" id="overlay"><div class="panel">
  <div style="display:flex;justify-content:space-between;align-items:center;"><h2 id="panelTitle"></h2><button class="btn ghost small" onclick="closePanel()">✕ Close</button></div>
  <div id="panelBody"></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabaseClient.js"></script>
<script src="../assets/js/nav.js"></script>
<script src="../assets/js/crud.js"></script>
<script src="../assets/js/validators.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const PAGE = 15;
let selTeams = new Map(), banks = [], ctx = null, B = null /* board data */, page = 0, selNum = null, selType = null, existingDriver = null, adjStaff = null, histScope = null, histPage = 0;

/* ---------- small helpers ---------- */
function friendly(err) {
  const m = err?.message || String(err);
  if (/staff_cnic_key|duplicate key.*cnic/i.test(m)) return "This CNIC is already registered in the system.";
  if (/staff_aic_no_uniq/i.test(m)) return "That AIC number is already taken in this union council.";
  if (/staff_one_ucmo_per_uc/i.test(m)) return "This union council already has an active UCMO.";
  if (/staff_iban_format_check/i.test(m)) return "The IBAN failed the checksum / format check.";
  if (/staff_phone_format_check/i.test(m)) return "Cell number must look like 03XX-XXXXXXX.";
  if (/staff_cnic_format_check/i.test(m)) return "CNIC must look like XXXXX-XXXXXXX-X.";
  if (/teams_uc_id_team_no_key|duplicate key.*team_no/i.test(m)) return "That team number already exists in this union council.";
  if (/row-level security/i.test(m)) return "You are not allowed to do this for this union council.";
  if (/update_team|PGRST202|schema cache/i.test(m)) return "Editing a team needs a database update that has not been applied yet (migration 0017). Ask the administrator to run it.";
  return m.replace(/^.*?TEAM_FULL: /, "");
}
const bankLabel = (b) => `${b.code} — ${b.name}`;
const bankFromInput = (v) => { v = (v || "").trim(); if (!v) return null; const code = v.split(" — ")[0].trim().toUpperCase();
  return banks.find(b => b.code === code) || banks.find(b => b.name.toLowerCase() === v.toLowerCase()) || null; };
const badge = (s) => `<span class="badge ${s === "active" ? "ok" : "attention"}">${STATUS_LABEL[s] || s}</span>`;
function cnicLine(s) {
  if (!s.cnic_pic_front_path || !s.cnic_pic_back_path) return `<b style="color:#9b1c1c">CNIC pictures missing</b>`;
  if (s.cnic_lifetime) return "CNIC ✓ lifetime";
  if (!s.cnic_expiry) return `<b style="color:#9b1c1c">CNIC expiry date missing</b>`;
  const days = Math.round((new Date(s.cnic_expiry + "T00:00:00Z") - new Date(new Date().toISOString().slice(0, 10) + "T00:00:00Z")) / 864e5);
  if (days < 0) return `<b style="color:#9b1c1c">CNIC EXPIRED on ${s.cnic_expiry}</b>`;
  if (days <= 90) return `<b style="color:#a15c00">CNIC expires soon (${s.cnic_expiry})</b>`;
  return `CNIC ✓ valid till ${s.cnic_expiry}`;
}
const typeName = (t) => (TEAM_TYPES.find(x => x[0] === t) || [, t])[1];
const ucId = () => $("ucSel").value;
const campId = () => $("campSel").value || null;
function openPanel(title, html) { $("panelTitle").textContent = title; $("panelBody").innerHTML = html; $("overlay").style.display = "block"; document.body.style.overflow = "hidden"; $("overlay").scrollTop = 0; }
function closePanel() { $("overlay").style.display = "none"; document.body.style.overflow = ""; ctx = null; }
const errBox = () => `<div class="error-text" id="pErr" style="display:none;white-space:pre-line;"></div>`;
const showErr = (e) => { const el = $("pErr"); el.textContent = friendly(e); el.style.display = "block"; el.scrollIntoView({ block: "nearest" }); };

/* ---------- init ---------- */
(async () => {
  const session = await requireAuth(); if (!session) return;
  renderSidebar("staff.html");
  const [{ data: ucs }, { data: bk }, { data: camps }] = await Promise.all([
    supabaseClient.from("union_councils").select("id, name").order("name"),
    supabaseClient.from("banks").select("code, name, iban_code").order("name"),
    supabaseClient.from("campaigns").select("id, name, status, start_date").order("start_date", { ascending: false })]);
  banks = bk || [];
  $("bankList").innerHTML = banks.map(b => `<option value="${esc(bankLabel(b))}">`).join("");
  $("ucSel").innerHTML = (ucs || []).map(u => `<option value="${u.id}">${esc(u.name)}</option>`).join("");
  $("campSel").innerHTML = `<option value="">(none)</option>` + (camps || []).map(c => `<option value="${c.id}">${esc(c.name)}${c.status === "closed" ? " (closed)" : ""}</option>`).join("");
  const cur = (camps || []).find(c => c.status !== "closed") || (camps || [])[0]; if (cur) $("campSel").value = cur.id;
  if (!(ucs || []).length) { $("board").innerHTML = `<div class="card"><p>No union council exists yet. Create a campaign first (Campaign Details) — that creates the union council.</p></div>`; return; }
  $("ucSel").onchange = () => { page = 0; loadBoard(); loadRows(); $("waitBox").open = false; };
  await loadBoard(); loadRows();
})();

/* ---------- the board ---------- */
async function loadBoard() {
  const uc = ucId();
  const [{ data: plan }, { data: people }, { data: teams }] = await Promise.all([
    supabaseClient.from("uc_plans").select("total_aics, total_teams").eq("uc_id", uc).maybeSingle(),
    supabaseClient.from("staff").select("id, uc_id, full_name, cnic, phone, designation, status, aic_no, aic_staff_id, can_have_driver, cnic_pic_front_path, cnic_pic_back_path, cnic_expiry, cnic_lifetime").eq("uc_id", uc).in("designation", ["ucmo", "aic", "driver"]).order("aic_no"),
    supabaseClient.from("teams").select("id, team_no, team_type, aic_staff_id, team_members(id, active, member_no, staff(id, full_name, phone, status, cnic_pic_front_path, cnic_pic_back_path, cnic_expiry, cnic_lifetime))").eq("uc_id", uc).order("team_no")]);
  const ucmo = (people || []).find(p => p.designation === "ucmo" && p.status === "active") || null;
  const aics = (people || []).filter(p => p.designation === "aic");
  const drivers = (people || []).filter(p => p.designation === "driver" && p.status !== "inactive");
  B = { uc, plan, ucmo, aics, drivers, teams: (teams || []).map(t => ({ ...t, active: (t.team_members || []).filter(m => m.active).sort((a, b) => a.member_no - b.member_no) })) };
  renderBoard();
}
function renderBoard() {
  const { plan, ucmo, aics, drivers, teams } = B;
  if (!ucmo) { $("board").innerHTML = `<div class="card"><h2>Step 1 — Add the UCMO</h2><p>Start with the UCMO of this union council. You will be asked how many Area Incharges and how many teams there will be.</p>
      <button class="btn" onclick="openPerson({kind:'ucmo'})">+ Add UCMO</button></div>`; return; }
  const nA = plan?.total_aics ?? Math.max(0, ...aics.map(a => a.aic_no)), nT = plan?.total_teams ?? Math.max(0, ...teams.map(t => t.team_no));
  const haveA = aics.length, haveT = teams.length, pc = (a, b) => b ? Math.min(100, Math.round(a * 100 / b)) : 0;
  let h = `<div class="card ucmo"><div style="display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;">
      <div><span class="tag">UCMO</span> <span class="big">${esc(ucmo.full_name)}</span><br><span class="muted">${esc(ucmo.phone)} · ${cnicLine(ucmo)}</span></div>
      <div><button class="btn small" onclick="openPerson({kind:'ucmo',staff:'${ucmo.id}'})">Edit</button> <button class="btn small ghost" onclick="openPlan()">Change numbers</button></div></div>
      <div style="margin-top:.6rem;display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
        <div>Area Incharges: <b>${haveA}</b> of ${nA}<div class="bar"><i style="width:${pc(haveA, nA)}%"></i></div></div>
        <div>Teams: <b>${haveT}</b> of ${nT}<div class="bar"><i style="width:${pc(haveT, nT)}%"></i></div></div></div></div>`;
  if (!plan) h += `<div class="card"><b>Tell the system how many Area Incharges and teams this union council will have.</b> <button class="btn small" onclick="openPlan()">Set the numbers</button></div>`;
  for (let n = 1; n <= nA; n++) {
    const a = aics.find(x => x.aic_no === n);
    if (!a) { h += `<div class="aic empty"><span><b>AIC ${n}</b> — not added yet</span><button class="btn small" onclick="openPerson({kind:'aic',aicNo:${n}})">+ Add AIC ${n}</button></div>`; continue; }
    const drv = drivers.find(d => d.aic_staff_id === a.id), mine = teams.filter(t => t.aic_staff_id === a.id);
    h += `<div class="aic"><div style="display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;">
        <div><span class="tag">AIC ${n}</span> <span class="big">${esc(a.full_name)}</span> ${a.status !== "active" ? badge(a.status) : ""}<br><span class="muted">${esc(a.phone)} · ${cnicLine(a)}</span></div>
        <div><button class="btn small" onclick="openPerson({kind:'aic',aicNo:${n},staff:'${a.id}'})">Edit</button>
          <button class="btn small ghost" onclick="openTeamPicker('${a.id}')">+ Add team</button></div></div>
      <div style="margin-top:.3rem;">Driver: ${drv ? `${esc(drv.full_name)} <button class="btn small ghost" onclick="openPerson({kind:'driver',aic:'${a.id}',aicNo:${n},staff:'${drv.id}'})">Edit</button>`
        : `<span class="muted">none</span> <button class="btn small ghost" onclick="openPerson({kind:'driver',aic:'${a.id}',aicNo:${n}})">+ Add driver</button>`}</div>
      ${mine.map(teamHtml).join("") || `<p class="muted" style="margin:.5rem 0 0;">No teams yet — press “+ Add team”.</p>`}</div>`;
  }
  const loose = teams.filter(t => !t.aic_staff_id);
  if (loose.length) h += `<div class="card"><b>Teams without an Area Incharge:</b> ${loose.map(t => t.team_no).join(", ")}</div>`;
  $("board").innerHTML = h;
}
function teamHtml(t) {
  const slot = (i) => { const m = t.active.find(x => x.member_no === i);
    if (!m) return `<div class="slot free"><span>Member ${i} — empty</span><button class="btn small" onclick="openPerson({kind:'member',team:'${t.id}'})">+ Add</button></div>`;
    const s = m.staff, f = s.cnic_pic_front_path, b = s.cnic_pic_back_path;
    return `<div class="slot"><b>${esc(s.full_name)}</b><br><span class="muted">${esc(s.phone)}</span><br>
      <span class="muted">${cnicLine(s)}</span><br>
      <button class="btn small" onclick="openPerson({kind:'member',staff:'${s.id}',team:'${t.id}'})">Edit</button>
      <button class="btn small ghost" onclick="openAdjust('${s.id}')">Move / change</button>
      <button class="btn small ghost" onclick="openPerson({kind:'member',team:'${t.id}',replace:'${s.id}'})">Replace</button></div>`; };
  return `<div class="team"><b>Team ${t.team_no}</b> <span class="tag">${typeName(t.team_type)}</span> <span class="muted">${t.active.length}/2 members</span> <button class="btn small ghost" onclick="openTeamEdit('${t.id}')">Edit team</button>
    <div class="slots">${slot(1)}${slot(2)}</div></div>`;
}

/* ---------- plan (how many AICs / teams) ---------- */
function planFields(aics, teams) {
  return `<div class="sect"><h3>Your structure</h3><div class="form-grid">
    <div><label>Total number of Area Incharges (1–20)</label><input type="number" id="p_aics" min="1" max="20" value="${aics ?? ""}"></div>
    <div><label>Total number of teams</label><input type="number" id="p_teams" min="1" max="200" value="${teams ?? ""}"></div></div>
    <p class="muted">These numbers create the empty AIC and team places you fill in next. You can change them later.</p></div>`;
}
function readPlan(errs) {
  const a = Number($("p_aics").value), t = Number($("p_teams").value);
  if (!Number.isInteger(a) || a < 1 || a > 20) errs.push("Number of Area Incharges must be between 1 and 20");
  if (!Number.isInteger(t) || t < 1 || t > 200) errs.push("Enter the total number of teams");
  return { a, t };
}
function openPlan() {
  openPanel("Change the numbers", planFields(B.plan?.total_aics, B.plan?.total_teams) + errBox() + `<button class="btn" style="margin-top:1rem;" id="planSave">Save</button>`);
  $("planSave").onclick = async () => { try { const e = []; const { a, t } = readPlan(e); if (e.length) throw new Error(e.join("\n"));
    const { error } = await supabaseClient.rpc("set_uc_plan", { p_uc: ucId(), p_aics: a, p_teams: t }); if (error) throw error; closePanel(); await loadBoard(); } catch (e) { showErr(e); } };
}

/* ---------- add team ---------- */
function openTeamPicker(aicId) {
  const a = B.aics.find(x => x.id === aicId), used = new Set(B.teams.map(t => t.team_no)), max = B.plan?.total_teams ?? 200;
  selNum = null; selType = null;
  openPanel(`Add a team for AIC ${a.aic_no}`, `<h3>1. What type of team is this?</h3>
    <div class="types" id="typeBtns">${TEAM_TYPES.map(t => `<button type="button" data-t="${t[0]}">${t[1]}</button>`).join("")}</div>
    <h3>2. Team number</h3><div class="numgrid" id="numGrid">${Array.from({ length: max }, (_, i) => i + 1).map(n => `<button type="button" data-n="${n}" class="${used.has(n) ? "taken" : ""}">${n}</button>`).join("")}</div>
    <p class="muted">Crossed-out numbers are already used.</p>
    ${errBox()}<button class="btn" style="margin-top:1rem;" id="teamSave">Create team</button>`);
  $("numGrid").onclick = (e) => { const b = e.target.closest("button"); if (!b || b.classList.contains("taken")) return; selNum = Number(b.dataset.n); $("numGrid").querySelectorAll("button").forEach(x => x.classList.toggle("sel", x === b)); };
  $("typeBtns").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; selType = b.dataset.t; $("typeBtns").querySelectorAll("button").forEach(x => x.classList.toggle("sel", x === b)); };
  $("teamSave").onclick = async () => { try { if (!selType) throw new Error("First choose the team type: Fixed, Transit or Mobile"); if (!selNum) throw new Error("Choose the team number");
    const { error } = await supabaseClient.from("teams").insert({ uc_id: ucId(), team_no: selNum, team_type: selType, aic_staff_id: aicId }); if (error) throw error;
    closePanel(); await loadBoard(); } catch (e) { showErr(e); } };
}

/* ---------- teams assigned to an Area Incharge (inside the AIC form) ---------- */
let curType = "";
function renderTeamGrid(editing) {
  curType = ""; $("tmTypeBtns").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; curType = b.dataset.t; $("tmTypeBtns").querySelectorAll("button").forEach(x => x.classList.toggle("sel", x === b)); };
  const max = B.plan?.total_teams ?? 60, own = editing?.id;
  $("tmGrid").innerHTML = Array.from({ length: max }, (_, i) => i + 1).map(n => {
    const t = B.teams.find(x => x.team_no === n), other = t && t.aic_staff_id && t.aic_staff_id !== own, mine = t && t.aic_staff_id === own;
    const who = other ? "AIC " + (B.aics.find(a => a.id === t.aic_staff_id)?.aic_no ?? "?") : "";
    return `<button type="button" data-n="${n}" class="${other ? "taken" : ""} ${mine || selTeams.has(n) ? "sel" : ""}" ${other ? `title="${who}"` : ""} ${mine ? "disabled" : ""}>${n}</button>`; }).join("");
  $("tmGrid").onclick = (e) => { const b = e.target.closest("button"); if (!b || b.classList.contains("taken") || b.disabled) return; const n = Number(b.dataset.n);
    if (selTeams.has(n)) selTeams.delete(n);
    else { const t = B.teams.find(x => x.team_no === n);
      if (!t && !curType) return alert("First choose the team type (Fixed, Transit or Mobile) above, then tap the team number.");
      selTeams.set(n, { id: t?.id || null, type: t?.team_type || curType }); }
    b.classList.toggle("sel"); renderTeamTypes(); };
  renderTeamTypes(editing);
}
function renderTeamTypes(editing) {
  const own = B.teams.filter(t => editing && t.aic_staff_id === editing.id).map(t => t.team_no).sort((a, b) => a - b);
  const chosen = [...selTeams.keys()].sort((a, b) => a - b);
  $("tmTypes").innerHTML = (own.length ? `<p class="muted">Already his/hers: ${own.join(", ")}</p>` : "") + chosen.map(n => { const v = selTeams.get(n);
    return `<div style="display:flex;gap:.6rem;align-items:center;margin:.25rem 0;"><b style="min-width:5.5rem;">Team ${n}</b>${v.id ? `<span class="muted">already exists (${typeName(v.type)})</span>`
      : `<select data-tn="${n}"><option value="">Choose type…</option>${TEAM_TYPES.map(t => `<option value="${t[0]}" ${v.type === t[0] ? "selected" : ""}>${t[1]}</option>`).join("")}</select>`}</div>`; }).join("")
    + (chosen.length ? `<p class="muted">${chosen.length} team(s) chosen: ${chosen.join(", ")}</p>` : `<p class="muted">No team chosen yet — you can also add teams later from the AIC card.</p>`);
  $("tmTypes").querySelectorAll("select[data-tn]").forEach(sel => sel.onchange = () => { selTeams.get(Number(sel.dataset.tn)).type = sel.value; });
}
async function assignTeams(aicId, uc) {
  const errs = [];
  for (const [n, v] of [...selTeams.entries()].sort((a, b) => a[0] - b[0])) {
    const { error } = v.id ? await supabaseClient.from("teams").update({ aic_staff_id: aicId }).eq("id", v.id)
                           : await supabaseClient.from("teams").insert({ uc_id: uc, team_no: n, team_type: v.type, aic_staff_id: aicId });
    if (error) errs.push(`Team ${n}: ${friendly(error)}`);
  }
  return errs.length ? "The Area Incharge was saved, but some teams could not be assigned — " + errs.join("; ") : null;
}

/* ---------- edit team (number, type, Area Incharge) ---------- */
function openTeamEdit(teamId) {
  const t = B.teams.find(x => x.id === teamId), used = new Set(B.teams.filter(x => x.id !== teamId).map(x => x.team_no)), max = B.plan?.total_teams ?? 200;
  selNum = t.team_no; selType = t.team_type;
  openPanel(`Edit Team ${t.team_no}`, `<h3>1. Team type (Fixed, Transit or Mobile)</h3><div class="types" id="typeBtns">${TEAM_TYPES.map(x => `<button type="button" data-t="${x[0]}" class="${x[0] === t.team_type ? "sel" : ""}">${x[1]}</button>`).join("")}</div>
    <h3>2. Team number</h3><div class="numgrid" id="numGrid">${Array.from({ length: max }, (_, i) => i + 1).map(n => `<button type="button" data-n="${n}" class="${used.has(n) ? "taken" : ""} ${n === t.team_no ? "sel" : ""}">${n}</button>`).join("")}</div>
    <h3>Area Incharge</h3><select id="teamAic">${B.aics.filter(a => a.status === "active").map(a => `<option value="${a.id}" ${a.id === t.aic_staff_id ? "selected" : ""}>AIC ${a.aic_no} — ${esc(a.full_name)}</option>`).join("")}</select>
    <p class="muted">If you give the team to another Area Incharge, its members move with it and the change is recorded in the history.</p>
    ${errBox()}<div style="margin-top:1rem;"><button class="btn" id="teamSave">Save</button> <button class="btn ghost" id="teamDel">Delete this team</button></div>`);
  $("numGrid").onclick = (e) => { const b = e.target.closest("button"); if (!b || b.classList.contains("taken")) return; selNum = Number(b.dataset.n); $("numGrid").querySelectorAll("button").forEach(x => x.classList.toggle("sel", x === b)); };
  $("typeBtns").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; selType = b.dataset.t; $("typeBtns").querySelectorAll("button").forEach(x => x.classList.toggle("sel", x === b)); };
  $("teamSave").onclick = async () => { try {
    const aic = $("teamAic").value, moved = aic !== t.aic_staff_id && t.active.length;
    if (moved && !confirm("The team's members will move to the new Area Incharge. Continue?")) return;
    const { error } = await supabaseClient.rpc("update_team", { p_team: t.id, p_team_no: selNum, p_type: selType, p_aic: aic, p_campaign: campId() }); if (error) throw error;
    closePanel(); await loadBoard(); } catch (e) { showErr(e); } };
  $("teamDel").onclick = async () => { try {
    if (t.active.length) throw new Error("This team still has members — move or remove them first.");
    const { count } = await supabaseClient.from("team_members").select("id", { count: "exact", head: true }).eq("team_id", t.id);
    if (count) throw new Error("This team has history, so it cannot be deleted. You can leave it empty or change its number.");
    if (!confirm(`Delete empty Team ${t.team_no}?`)) return;
    const { error } = await supabaseClient.from("teams").delete().eq("id", t.id); if (error) throw error; closePanel(); await loadBoard(); } catch (e) { showErr(e); } };
}

function wirePerson(p) {
  $(`${p}_cnic`).oninput = (e) => e.target.value = Validate.formatCnic(e.target.value);
  for (const f of ["phone", "pay"]) $(`${p}_${f}`).oninput = (e) => e.target.value = Validate.formatMobile(e.target.value);

    const bank = bankFromInput($(`${p}_bank`).value), r = Validate.iban($(`${p}_iban`).value, bank), c = (cls, t) => `<span class="${cls}">${t}</span>`; let h = "";
    if (!r.empty) {
      h += c(r.format ? "good" : "bad", r.format ? "Format valid" : (r.length ? "Format invalid" : "Length is not 24"));
      h += c(r.format ? (r.checksum ? "good" : "bad") : "na", r.format ? (r.checksum ? "Checksum valid" : "Checksum INVALID") : "Checksum —");
      h += c(r.bank === "matched" ? "good" : r.bank === "mismatch" ? "bad" : "na", r.bank === "matched" ? "Bank matched" : r.bank === "mismatch" ? `Bank mismatch (IBAN says ${r.bankCode})` : (bank ? "Bank code not on file — not checked" : "No bank selected"));
      h += c("na", "Account holder: not verified (no verification service connected)");
    }
    $(`${p}_chips`).innerHTML = h;
    if (!r.empty && r.format && r.bankCode && !$(`${p}_bank`).value) { const g = banks.find(b => b.iban_code === r.bankCode); if (g) $(`${p}_bank`).value = bankLabel(g); }
  };
  for (const [side, f] of [["front", "f"], ["back", "b"]]) $(`${p}_${f}file`).onchange = (e) => {
    const file = e.target.files[0], prev = $(`${p}_${f}prev`); if (!file) { prev.style.display = "none"; return; }

    if (file.size > 6 * 1024 * 1024) { alert("The picture is bigger than 6 MB — please use a smaller photo."); e.target.value = ""; return; }
    prev.src = URL.createObjectURL(file); prev.style.display = "block"; $(`${p}_${f}st`).textContent = "New picture chosen ✓"; };
  $(`${p}_life`).onchange = (e) => { $(`${p}_exp`).disabled = e.target.checked; if (e.target.checked) $(`${p}_exp`).value = ""; };

}
function fillPerson(p, s) {
  $(`${p}_name`).value = s.full_name || ""; $(`${p}_father`).value = s.father_name || ""; $(`${p}_cnic`).value = s.cnic || ""; $(`${p}_phone`).value = s.phone || "";
  $(`${p}_wallet`).value = s.payment_wallet || ""; const same = !s.payment_number || s.payment_number === s.phone;
  $(`${p}_same`).checked = same; $(`${p}_payrow`).style.display = same ? "none" : "block"; $(`${p}_pay`).value = s.payment_number || "";
  const b = banks.find(x => x.code === s.bank_code); $(`${p}_bank`).value = b ? bankLabel(b) : ""; $(`${p}_iban`).value = s.iban || "";
  if (s.bank_code || s.iban) $(`${p}_bank`).closest("details").open = true; $(`${p}_iban`).dispatchEvent(new Event("input"));
  $(`${p}_life`).checked = !!s.cnic_lifetime; $(`${p}_exp`).disabled = !!s.cnic_lifetime; $(`${p}_exp`).value = s.cnic_expiry || ""; $(`${p}_exp`).dataset.orig = s.cnic_expiry || "";
  for (const [side, f] of [["front", "f"], ["back", "b"]]) { const path = s[`cnic_pic_${side}_path`]; $(`${p}_${f}file`).dataset.existing = path || "";
    $(`${p}_${f}st`).innerHTML = path ? `Uploaded ✓ — choose a file only if you want to replace it. <a href="#" onclick="previewExisting('${p}','${f}','${path}');return false;">Preview</a>` : "Required"; }
}
async function previewExisting(p, f, path) { const u = await signedUrl(path); const img = $(`${p}_${f}prev`); if (u) { img.src = u; img.style.display = "block"; } }
function readPerson(p, errs, label) {
  const v = (f) => $(`${p}_${f}`).value.trim();
  const name = v("name"), father = v("father"), cnic = v("cnic"), phone = v("phone"), wallet = v("wallet"), iban = Validate.normalizeIban(v("iban")), bank = bankFromInput(v("bank"));
  const pay = $(`${p}_same`).checked ? phone : v("pay");
  if (!name) errs.push(`${label}: name is required`);
  if (!father) errs.push(`${label}: father name is required`);
  if (!Validate.isCnic(cnic)) errs.push(`${label}: CNIC must be 13 digits`);
  if (!Validate.isMobile(phone)) errs.push(`${label}: cell number must be like 03XX-XXXXXXX`);
  if (!wallet) errs.push(`${label}: choose the payment wallet (EasyPaisa, JazzCash or Other)`);
  if (!$(`${p}_same`).checked && !Validate.isMobile(pay)) errs.push(`${label}: wallet number must be like 03XX-XXXXXXX`);
  if (v("bank") && !bank) errs.push(`${label}: choose a bank from the list (or OTHER)`);
  if (iban) { const r = Validate.iban(iban, bank);
    if (!r.format) errs.push(`${label}: IBAN must be PK + 22 characters (24 in total)`);
    else if (!r.checksum) errs.push(`${label}: IBAN checksum is wrong — check for a typing mistake`);
    else if (r.bank === "mismatch") errs.push(`${label}: IBAN belongs to bank code ${r.bankCode}, not the selected bank`); }
  const life = $(`${p}_life`).checked, exp = $(`${p}_exp`).value, today = new Date().toISOString().slice(0, 10);
  const fF = $(`${p}_ffile`).files[0] || null, bF = $(`${p}_bfile`).files[0] || null;
  if (!fF && !$(`${p}_ffile`).dataset.existing) errs.push(`${label}: CNIC front picture is required`);
  if (!bF && !$(`${p}_bfile`).dataset.existing) errs.push(`${label}: CNIC back picture is required`);
  if (!life) { if (!exp) errs.push(`${label}: CNIC expiry date is required (or tick "Lifetime CNIC")`);
    else if (exp < today && exp !== $(`${p}_exp`).dataset.orig) errs.push(`${label}: this CNIC expired on ${exp} — a valid CNIC is needed`); }
  return { full_name: name, father_name: father, cnic, phone, payment_number: pay, payment_wallet: wallet || null, bank_code: bank?.code || null, iban: iban || null,
           cnic_expiry: life ? null : (exp || null), cnic_lifetime: life, _front: fF, _back: bF };
}
async function saveCnic(rec, front, back) {
  const upd = {};
  for (const [side, file] of [["front", front], ["back", back]]) { if (!file) continue;
    const ext = file.type === "image/png" ? "png" : "jpg", col = `cnic_pic_${side}_path`, path = `${rec.uc_id}/${rec.id}/${side}.${ext}`;
    if (rec[col] && rec[col] !== path) await supabaseClient.storage.from("staff-documents").remove([rec[col]]);
    const { error } = await supabaseClient.storage.from("staff-documents").upload(path, file, { upsert: true, contentType: file.type });
    if (error) return `The CNIC ${side} picture could not be uploaded (${error.message})`;
    upd[col] = path; }
  if (Object.keys(upd).length) { const { error } = await supabaseClient.from("staff").update(upd).eq("id", rec.id); if (error) return error.message; Object.assign(rec, upd); }
  return null;
}
async function signedUrl(path) { const { data } = await supabaseClient.storage.from("staff-documents").createSignedUrl(path, 300); return data?.signedUrl || null; }

async function openPerson(c) {
  ctx = c; let editing = null;
  if (c.staff) { const { data, error } = await supabaseClient.from("staff").select("*").eq("id", c.staff).single(); if (error) return alert(error.message); editing = data; ctx.editing = data; }
  const aic = c.aic ? B.aics.find(a => a.id === c.aic) : null, team = c.team ? B.teams.find(t => t.id === c.team) : null;
  const title = { ucmo: editing ? "Edit UCMO" : "Add UCMO", aic: `${editing ? "Edit" : "Add"} Area Incharge ${c.aicNo}`, driver: `${editing ? "Edit" : "Add"} driver for AIC ${c.aicNo}`,
    member: editing ? `Edit team member — Team ${team?.team_no ?? ""}` : c.replace ? `Replace a member of Team ${team?.team_no}` : `Add member to Team ${team?.team_no}` }[c.kind];
  let extra = "";
  if (c.kind === "ucmo" && !editing) extra += planFields(null, null);
  if (c.kind === "aic") extra += `<div class="sect"><h3>Does this Area Incharge have a driver?</h3><div class="radios"><label><input type="radio" name="hasDrv" value="no" checked> No</label><label><input type="radio" name="hasDrv" value="yes"> Yes</label></div>
      <div id="drvBox" style="display:none;margin-top:.5rem;"><h3>Driver details</h3>${personFields("d")}</div></div>
    <div class="sect"><h3>Which teams are assigned to this Area Incharge?</h3>
      <p><b>First choose the team type</b>, then tap the team numbers of that type. Change the type and tap more numbers for the other kinds.</p>
      <div class="types" id="tmTypeBtns">${TEAM_TYPES.map(t => `<button type="button" data-t="${t[0]}">${t[1]} team</button>`).join("")}</div>
      <p class="muted" style="margin:.5rem 0;">Green = chosen, crossed out = already with another Area Incharge.</p>
      <div class="numgrid" id="tmGrid"></div><div id="tmTypes" style="margin-top:.6rem;"></div></div>`;
  if (c.kind === "member" && c.replace && !editing) extra += `<div class="sect"><b>This person will replace a member of Team ${team.team_no}.</b>${replaceBlock("nr")}</div>`;
  if (editing && c.kind !== "member") extra += `<div class="sect"><label>Status</label><select id="f_status"><option value="active">Active</option><option value="inactive">Inactive</option><option value="left_campaign">Left campaign</option></select></div>`;
  openPanel(title, `<div class="sect"><h3>Personal details</h3>${personFields("f")}</div>${extra}${errBox()}
    <div style="margin-top:1rem;"><button class="btn" id="saveBtn">Save</button> <button class="btn ghost" onclick="closePanel()">Cancel</button></div>`);
  wirePerson("f"); if (editing) { fillPerson("f", editing); if ($("f_status")) $("f_status").value = editing.status === "active" ? "active" : editing.status === "left_campaign" ? "left_campaign" : "inactive"; }
  if (c.kind === "aic") {
    selTeams = new Map(); renderTeamGrid(editing);
    wirePerson("d"); existingDriver = null;
    document.querySelectorAll('input[name="hasDrv"]').forEach(r => r.onchange = () => { $("drvBox").style.display = r.value === "yes" ? "block" : "none"; });
    const drv = editing ? B.drivers.find(d => d.aic_staff_id === editing.id) : null;
    if (drv) { const { data } = await supabaseClient.from("staff").select("*").eq("id", drv.id).single(); existingDriver = data;
      document.querySelector('input[name="hasDrv"][value="yes"]').checked = true; document.querySelectorAll('input[name="hasDrv"]').forEach(r => r.disabled = true); $("drvBox").style.display = "block"; fillPerson("d", data); }
  }
  if (c.kind === "member" && c.replace && !editing) { await loadReplaceBlock("nr", c.team); const r = document.querySelector(`input[name="nr_who"][value="${c.replace}"]`); if (r) r.checked = true; }
  $("saveBtn").onclick = savePerson;
}

async function savePerson() {
  const btn = $("saveBtn"); btn.disabled = true; $("pErr").style.display = "none";
  try {
    const c = ctx, ed = c.editing, errs = [], uc = ucId(), label = { ucmo: "UCMO", aic: "Area Incharge", driver: "Driver", member: "Team member" }[c.kind];
    const { _front, _back, ...p } = readPerson("f", errs, label);
    let plan = null, drv = null, replace = null; const team = c.team ? B.teams.find(t => t.id === c.team) : null;
    if (c.kind === "ucmo" && !ed) plan = readPlan(errs);
    if (c.kind === "aic") { const yes = document.querySelector('input[name="hasDrv"]:checked').value === "yes"; p.can_have_driver = yes;
      if (yes) { const { _front: dF, _back: dB, ...dp } = readPerson("d", errs, "Driver"); drv = { payload: { uc_id: uc, designation: "driver", ...dp }, front: dF, back: dB }; } }
    if (c.kind === "aic") for (const [n, v] of selTeams) if (!v.id && !v.type) errs.push(`Choose the type of Team ${n} (Fixed, Transit or Mobile)`);
    if (c.kind === "member" && c.replace && !ed) replace = readReplaceBlock("nr", errs);
    if (c.kind === "member" && !ed && !team?.aic_staff_id) errs.push("This team has no Area Incharge yet");
    if (errs.length) throw new Error(errs.join("\n"));
    if ($("f_status") && ed && $("f_status").value !== "active" && ed.status === "active" && !confirm("Make this person " + $("f_status").selectedOptions[0].text + "?")) return;
    const row = { uc_id: uc, ...p };
    if (c.kind === "ucmo") row.designation = "ucmo";
    if (c.kind === "aic") { row.designation = "aic"; row.aic_no = c.aicNo; }
    if (c.kind === "driver") { row.designation = "driver"; row.aic_staff_id = c.aic; await supabaseClient.from("staff").update({ can_have_driver: true }).eq("id", c.aic); }
    if (c.kind === "member") { row.designation = "team_member"; if (team) row.aic_staff_id = team.aic_staff_id; }
    if ($("f_status") && ed) row.status = $("f_status").value;
    if (plan) { const { error } = await supabaseClient.rpc("set_uc_plan", { p_uc: uc, p_aics: plan.a, p_teams: plan.t }); if (error) throw error; }
    let rec;
    if (ed) { const { uc_id, ...upd } = row; delete upd.designation; delete upd.aic_staff_id; delete upd.aic_no;
      const { data, error } = await supabaseClient.from("staff").update(upd).eq("id", ed.id).select().single(); if (error) throw error; rec = data; }
    else { const { data, error } = await supabaseClient.from("staff").insert(row).select().single(); if (error) throw error; rec = data; }

    const notes = [];
    const upErr = await saveCnic(rec, _front, _back);                       // pictures first, so the person is complete before joining a team
    if (upErr) notes.push(`${upErr}. The person is saved — open them again and add the picture.`);
    if (c.kind === "aic" && drv) {
      drv.payload.aic_staff_id = rec.id;
      const { data: dr, error } = await (existingDriver ? supabaseClient.from("staff").update(drv.payload).eq("id", existingDriver.id).select().single() : supabaseClient.from("staff").insert(drv.payload).select().single());
      if (error) notes.push("The Area Incharge was saved, but the driver was not: " + friendly(error));
      else { const e2 = await saveCnic(dr, drv.front, drv.back); if (e2) notes.push("Driver: " + e2); }
    }
    if (c.kind === "aic" && selTeams.size) { const tErr = await assignTeams(rec.id, uc); if (tErr) notes.push(tErr); }
    if (c.kind === "member" && !ed) {
      if (upErr) notes.push("The member is not on the team yet. Add the pictures (People not on a team → Edit), then put them on the team.");
      else {
        const args = replace ? { p_action: "replace", p_staff: rec.id, p_reason: replace.reason, p_campaign: campId(), p_to_team: team.id, p_replace_staff: replace.who, p_old_disposition: replace.disp, p_old_to_team: replace.dest }
                             : { p_action: "assign", p_staff: rec.id, p_campaign: campId(), p_to_team: team.id };
        const { error } = await supabaseClient.rpc("adjust_team_member", args);
        if (error) notes.push(`The person is saved but is not on the team yet: ${friendly(error)}`);
      }
    }
    closePanel(); await loadBoard(); loadRows(); if (notes.length) alert(notes.join("\n\n"));
  } catch (e) { showErr(e); } finally { btn.disabled = false; }
}

/* ---------- replace chooser ---------- */
function replaceBlock(id) {
  return `<div id="${id}_who" class="radios" style="margin-top:.5rem;"></div>
    <b>What happens to the member who is replaced?</b>
    <div class="radios"><label><input type="radio" name="${id}_disp" value="left_campaign"> Left the campaign</label>
      <label><input type="radio" name="${id}_disp" value="transfer"> Moves to another team</label>
      <label><input type="radio" name="${id}_disp" value="reserve"> Stays available (reserve)</label>
      <label><input type="radio" name="${id}_disp" value="other"> Something else</label></div>
    <div id="${id}_dest" style="display:none;"></div><label>Reason (required)</label><input id="${id}_reason" placeholder="why is this change being made?">`;
}
async function loadReplaceBlock(id, teamId) {
  const { data } = await supabaseClient.from("team_members").select("member_no, staff(id, full_name)").eq("team_id", teamId).eq("active", true).order("member_no");
  $(`${id}_who`).innerHTML = (data || []).map(m => `<label><input type="radio" name="${id}_who" value="${m.staff.id}"> Replace ${esc(m.staff.full_name)} (member ${m.member_no})</label>`).join("") || `<p class="muted">This team has no active members.</p>`;
  document.querySelectorAll(`input[name="${id}_disp"]`).forEach(r => r.onchange = () => {
    const box = $(`${id}_dest`); if (r.value !== "transfer") { box.style.display = "none"; return; }
    const opts = B.teams.filter(t => t.id !== teamId).map(t => `<option value="${t.id}" ${t.active.length >= 2 ? "disabled" : ""}>Team ${t.team_no} · ${typeName(t.team_type)} · ${t.active.length}/2${t.active.length >= 2 ? " (full)" : ""}</option>`).join("");
    box.style.display = "block"; box.innerHTML = `<label>Move to team</label><select id="${id}_destSel"><option value="">Select…</option>${opts}</select>`; });
}
function readReplaceBlock(id, errs) {
  const who = document.querySelector(`input[name="${id}_who"]:checked`)?.value, disp = document.querySelector(`input[name="${id}_disp"]:checked`)?.value;
  const reason = $(`${id}_reason`).value.trim(), dest = $(`${id}_destSel`)?.value || null;
  if (!who) errs.push("Choose which member is being replaced"); if (!disp) errs.push("Choose what happens to the replaced member");
  if (disp === "transfer" && !dest) errs.push("Choose the team the replaced member moves to"); if (reason.length < 3) errs.push("A reason is required");
  return { who, disp, reason, dest };
}

/* ---------- move / change a team member ---------- */
async function openAdjust(id) {
  const { data: s } = await supabaseClient.from("staff").select("id, uc_id, full_name, status, team_members(active, team_id, member_no, teams(team_no, team_type))").eq("id", id).single();
  adjStaff = s; const cur = (s.team_members || []).find(m => m.active);
  openPanel("Move / change — " + s.full_name, `<p>${badge(s.status)} ${cur ? `Team ${cur.teams.team_no} (${typeName(cur.teams.team_type)}), member ${cur.member_no}` : "not on any team"}</p>
    <label>What happened?</label><select id="adjAct"><option value="">Select…</option>
      ${cur ? `<option value="leave">Left Polio / the campaign</option><option value="reserve">Take off the team — keep available (reserve)</option><option value="swap">Swap with a member of another team</option>` : ""}
      <option value="transfer">${cur ? "Move to another team" : "Put on a team"}</option><option value="replace">Put in a full team, replacing a member</option></select>
    <div id="adjFields"></div>${errBox()}<div style="margin-top:.8rem;"><button class="btn" id="adjGo" style="display:none;">Confirm</button> <button class="btn ghost" onclick="closePanel()">Cancel</button></div>
    <p><a href="#" onclick="openHistory({staff:'${s.id}', title:'History — ${esc(s.full_name).replace(/'/g, "")}'});return false;">See this person's history</a></p>`);
  $("adjAct").onchange = renderAdjFields; $("adjGo").onclick = doAdjust;
}
function teamOpts(excl, onlyFree) { return B.teams.filter(t => t.id !== excl && (!onlyFree || t.active.length < 2)).map(t => `<option value="${t.id}">Team ${t.team_no} · ${typeName(t.team_type)} · ${t.active.length}/2</option>`).join(""); }
async function renderAdjFields() {
  const a = $("adjAct").value, cur = (adjStaff.team_members || []).find(m => m.active); $("adjGo").style.display = a ? "inline-block" : "none";
  const dateF = `<label>Date</label><input type="date" id="adjDate" value="${new Date().toISOString().slice(0, 10)}">`, reasonF = `<label>Reason ${a === "transfer" ? "(optional)" : "(required)"}</label><input id="adjReason">`; let h = "";
  if (a === "leave" || a === "reserve") h = reasonF + dateF;
  else if (a === "transfer") h = `<label>Team (only teams with a free place)</label><select id="adjTeam"><option value="">Select…</option>${teamOpts(cur?.team_id, true)}</select>${reasonF}${dateF}`;
  else if (a === "replace") h = `<label>Team</label><select id="adjTeam"><option value="">Select…</option>${teamOpts(cur?.team_id, false)}</select><div id="adjRep"></div>${dateF}`;
  else if (a === "swap") { const { data } = await supabaseClient.from("team_members").select("staff_id, teams(team_no), staff(full_name)").eq("active", true).neq("staff_id", adjStaff.id).neq("team_id", cur.team_id);
    h = `<label>Swap with</label><select id="adjWith"><option value="">Select…</option>${(data || []).map(m => `<option value="${m.staff_id}">${esc(m.staff.full_name)} — Team ${m.teams.team_no}</option>`).join("")}</select>${reasonF}${dateF}`; }
  $("adjFields").innerHTML = h;
  if (a === "replace") $("adjTeam").onchange = async () => { const t = $("adjTeam").value; $("adjRep").innerHTML = t ? replaceBlock("ar") : ""; if (t) await loadReplaceBlock("ar", t); };
}
async function doAdjust() {
  const go = $("adjGo"); go.disabled = true; $("pErr").style.display = "none";
  try {
    const a = $("adjAct").value, errs = [], args = { p_action: a, p_staff: adjStaff.id, p_campaign: campId(), p_effective: $("adjDate")?.value || undefined };
    if (a === "replace") { args.p_to_team = $("adjTeam").value; if (!args.p_to_team) errs.push("Choose the team"); else { const r = readReplaceBlock("ar", errs); args.p_replace_staff = r.who; args.p_old_disposition = r.disp; args.p_old_to_team = r.dest; args.p_reason = r.reason; } }
    else { args.p_reason = $("adjReason")?.value.trim() || null;
      if (a === "transfer") { args.p_to_team = $("adjTeam").value; if (!args.p_to_team) errs.push("Choose the team"); }
      if (a === "swap") { args.p_swap_with = $("adjWith").value; if (!args.p_swap_with) errs.push("Choose who to swap with"); }
      if (a !== "transfer" && (args.p_reason || "").length < 3) errs.push("A reason is required"); }
    if (errs.length) throw new Error(errs.join("\n"));
    if (!confirm("Save this change? It is recorded permanently in the history.")) return;
    const { error } = await supabaseClient.rpc("adjust_team_member", args); if (error) throw error;
    closePanel(); await loadBoard(); loadRows();
  } catch (e) { showErr(e); } finally { go.disabled = false; }
}

/* ---------- history (loaded only when opened) ---------- */
const ADJ_LABEL = { assign: "Put on team", leave: "Left campaign", transfer: "Moved", reserve: "Reserve", replaced: "Replaced", replacement_in: "Joined as replacement", swap: "Swapped" };
async function openHistory(scope) {
  histScope = scope; histPage = 0;
  openPanel(scope.title, `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Person</th><th>What</th><th>From</th><th>To</th><th>Reason</th></tr></thead><tbody id="histBody"></tbody></table></div><button class="btn ghost small" id="histMore" style="display:none;">Load more</button>`);
  $("histMore").onclick = () => { histPage++; loadHistory(); }; await loadHistory();
}
async function loadHistory() {
  let q = supabaseClient.from("staff_adjustment_history").select("effective_date, adjustment_type, from_team_no, to_team_no, from_team_type, to_team_type, reason, staff(full_name), from_aic:from_aic_id(aic_no), to_aic:to_aic_id(aic_no)").order("created_at", { ascending: false }).range(histPage * 25, histPage * 25 + 24);
  q = histScope.staff ? q.eq("staff_id", histScope.staff) : q.eq("uc_id", histScope.uc); const { data, error } = await q;
  if (error) { $("histBody").innerHTML = `<tr><td colspan="6">${esc(error.message)}</td></tr>`; return; }
  const loc = (t, ty, aic) => t ? `Team ${t} (${typeName(ty)})${aic ? ` · AIC ${aic.aic_no}` : ""}` : "—";
  if (!histPage && !data.length) $("histBody").innerHTML = `<tr><td colspan="6" class="muted">Nothing recorded yet.</td></tr>`;
  $("histBody").insertAdjacentHTML("beforeend", data.map(h => `<tr><td>${h.effective_date}</td><td>${esc(h.staff?.full_name)}</td><td>${ADJ_LABEL[h.adjustment_type]}</td><td>${loc(h.from_team_no, h.from_team_type, h.from_aic)}</td><td>${loc(h.to_team_no, h.to_team_type, h.to_aic)}</td><td>${esc(h.reason || "")}</td></tr>`).join(""));
  $("histMore").style.display = data.length === 25 ? "inline-block" : "none";
}

/* ---------- waiting list + search (load on demand) ---------- */
$("waitBox").addEventListener("toggle", async () => {
  if (!$("waitBox").open) return; $("waitList").textContent = "Loading…";
  const { data } = await supabaseClient.from("staff").select("id, full_name, cnic, phone, status, planned_team_no, planned_member_no, team_members(active)").eq("uc_id", ucId()).eq("designation", "team_member").order("full_name").limit(300);
  const idle = (data || []).filter(s => !(s.team_members || []).some(m => m.active));
  $("waitList").innerHTML = idle.length ? `<div class="table-wrap"><table><tbody>${idle.map(s => `<tr><td>${esc(s.full_name)}</td><td>${esc(s.cnic)}</td><td>${badge(s.status)}</td><td>${s.planned_team_no ? `<span class="muted">Expected: Team ${s.planned_team_no}</span>` : ""}</td><td><button class="btn small ghost" onclick="openPerson({kind:'member',staff:'${s.id}'})">Edit / CNIC</button> ${s.planned_team_no ? `<button class="btn small" onclick="placePlanned('${s.id}', ${s.planned_team_no})">Put on Team ${s.planned_team_no}</button>` : `<button class="btn small" onclick="openAdjust('${s.id}')">Put on a team</button>`} <button class="btn small ghost" onclick="openAdjust('${s.id}')">Other…</button></td></tr>`).join("")}</tbody></table></div>` : "Everyone is on a team.";
});
async function placePlanned(id, teamNo) {
  const t = B.teams.find(x => x.team_no === teamNo);
  if (!t) return alert(`Team ${teamNo} does not exist yet. Create it first from its Area Incharge's card (+ Add team).`);
  const { error } = await supabaseClient.rpc("adjust_team_member", { p_action: "assign", p_staff: id, p_campaign: campId(), p_to_team: t.id });
  if (error) return alert(friendly(error));
  await loadBoard(); loadRows(); $("waitBox").open = false; $("waitBox").open = true;
}
async function loadRows() {
  let q = supabaseClient.from("staff").select("id, full_name, cnic, phone, designation, status, aic_no, team_members(active, teams(team_no))", { count: "exact" }).eq("uc_id", ucId()).order("designation").order("full_name").range(page * PAGE, page * PAGE + PAGE - 1);
  if ($("fDes").value) q = q.eq("designation", $("fDes").value); if ($("fStatus").value) q = q.eq("status", $("fStatus").value);
  const s = $("fQ").value.trim().replace(/[%,()]/g, ""); if (s) q = q.or(`full_name.ilike.%${s}%,cnic.ilike.%${s}%`);
  const { data, error, count } = await q; if (error) { $("rows").innerHTML = `<tr><td colspan="7">${esc(error.message)}</td></tr>`; return; }
  $("pageInfo").textContent = `${count ? page * PAGE + 1 : 0}–${Math.min((page + 1) * PAGE, count || 0)} of ${count || 0}`; $("prevP").disabled = page === 0; $("nextP").disabled = (page + 1) * PAGE >= (count || 0);
  $("rows").innerHTML = (data || []).map(r => { const tm = (r.team_members || []).find(m => m.active);
    const kind = { ucmo: "ucmo", aic: "aic", driver: "driver", team_member: "member" }[r.designation];
    return `<tr><td>${esc(r.full_name)}</td><td>${DESIGNATIONS[r.designation]}${r.aic_no ? " " + r.aic_no : ""}</td><td>${esc(r.cnic)}</td><td>${esc(r.phone)}</td><td>${tm ? "Team " + tm.teams.team_no : "—"}</td><td>${badge(r.status)}</td>
      <td><button class="btn small ghost" onclick="findEdit('${r.id}')">Open</button></td></tr>`; }).join("") || `<tr><td colspan="7" class="muted">No staff found.</td></tr>`;
}
async function findEdit(id) {
  const { data: s } = await supabaseClient.from("staff").select("id, designation, aic_no, aic_staff_id, team_members(active, team_id)").eq("id", id).single();
  if (s.designation === "team_member") { const tm = (s.team_members || []).find(m => m.active); return openPerson({ kind: "member", staff: id, team: tm?.team_id }); }
  if (s.designation === "ucmo") return openPerson({ kind: "ucmo", staff: id });
  if (s.designation === "aic") return openPerson({ kind: "aic", aicNo: s.aic_no, staff: id });
  const a = B.aics.find(x => x.id === s.aic_staff_id); return openPerson({ kind: "driver", aic: s.aic_staff_id, aicNo: a?.aic_no ?? "", staff: id });
}
["fDes", "fStatus"].forEach(i => $(i).addEventListener("change", () => { page = 0; loadRows(); }));
let qT; $("fQ").addEventListener("input", () => { clearTimeout(qT); qT = setTimeout(() => { page = 0; loadRows(); }, 300); });
$("prevP").onclick = () => { if (page > 0) { page--; loadRows(); } }; $("nextP").onclick = () => { page++; loadRows(); };
</script>
</body>
</html>
